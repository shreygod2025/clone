<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <style>body{font-family:system-ui,sans-serif;padding:24px;text-align:center;color:#334155}</style>
</head>
<body>
  <p>Finalising your booking…</p>
  <script>
    (function(){
      var p = new URLSearchParams(window.location.search);
      var target = p.get('target');
      // Strip forwarded params from Cashfree and append our own return payload
      var order = p.get('order_id') || '';
      var reg = p.get('registration_id') || '';
      if (!target) {
        document.body.innerHTML = '<p>Payment complete. If you are not redirected automatically, please close this window.</p>';
        return;
      }
      // Whitelist target host: only allow *.emergentagent.com, oll.co, localhost.
      var t;
      try { t = new URL(decodeURIComponent(target)); } catch(e) { return; }
      var host = t.hostname;
      var safe = host === 'oll.co' || host === 'www.oll.co' || /\.emergentagent\.(com|net|host)$/.test(host) || host === 'localhost';
      if (!safe) {
        document.body.innerHTML = '<p>Payment complete.</p>';
        return;
      }
      var sep = t.search ? '&' : '?';
      window.location.replace(t.toString() + sep + 'order_id=' + encodeURIComponent(order) + '&registration_id=' + encodeURIComponent(reg));
    })();
  </script>
</body>
</html>
