        <!-- ──────────────────────────────────────────────────────────────
             DEFAULT META — represents the homepage only.
             Every route page sets its own title/description/canonical/OG
             via React Helmet at runtime. Pre-rendered builds replace
             these on the static HTML for each route.
             ────────────────────────────────────────────────────────────── -->
        <title>OLL — Robotics, AI & Coding Classes for Kids in India | Skill Education</title>

        <meta name="keywords" content="robotics classes for kids, AI classes for kids, coding for children India, summer camp Mumbai, STEM education, OLL learning, after-school skill classes, CBSE robotics curriculum, ICSE coding classes" />

            "contactType": "customer service",
            "areaServed": "IN",
            "availableLanguage": ["English", "Hindi"],
            "email": "welcome@oll.co"

          "knowsAbout": [
            "Robotics for kids",
            "Coding for kids",
            "AI education",
            "STEM education",
            "Entrepreneurship for children",
            "Financial literacy for kids"
          ]
        }
        </script>

        {
          "@context": "https://schema.org",
          "@type": "WebSite",
          "@id": "https://oll.co/#website",
          "name": "OLL — Learn Future Skills",
          "url": "https://oll.co",
          "publisher": { "@id": "https://oll.co/#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://oll.co/blogs?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          },
          "inLanguage": "en-IN"
        }
        </script>
